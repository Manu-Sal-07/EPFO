[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfcompass"
version = "0.1.0"
description = "PF Compass — Citizen-first EPFO experience"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "pydantic[email]>=2.7.0,<3.0.0",
    "email-validator>=2.1.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "alembic>=1.13.0,<1.14.0",
    "pgvector>=0.2.5,<0.3.0",
    "redis>=5.0.0,<5.1.0",
    "python-jose[cryptography]>=3.3.0,<3.4.0",
    "passlib[bcrypt]>=1.7.4,<1.8.0",
    "bcrypt==4.0.1",
    "slowapi>=0.1.9,<0.2.0",
    "httpx>=0.27.0,<0.28.0",
    "structlog>=24.1.0,<25.0.0",
    "python-dotenv>=1.0.1,<1.1.0",
    "groq>=0.9.0,<0.10.0",
    "openai>=1.30.0,<2.0.0",
    "langchain>=0.2.0,<0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pfcompass*"]


# ─── Tool: Ruff (linter + formatter) ────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["pfcompass", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type hints)
]
ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "S101",   # Use of assert (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"scripts/**" = ["ANN"]
"alembic/**" = ["ANN"]

# ─── Tool: mypy (type checking) ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

# ─── Tool: pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ─── Tool: Coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pfcompass"]
omit = ["*/tests/*", "*/alembic/*", "*/scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
