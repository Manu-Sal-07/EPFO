[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfcompass"
version = "0.1.0"
description = "PF Compass — Citizen-first EPFO experience"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfcompass*"]


# ─── Tool: Ruff (linter + formatter) ────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["pfcompass", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type hints)
]
ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "S101",   # Use of assert (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"scripts/**" = ["ANN"]
"alembic/**" = ["ANN"]

# ─── Tool: mypy (type checking) ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

# ─── Tool: pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ─── Tool: Coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pfcompass"]
omit = ["*/tests/*", "*/alembic/*", "*/scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
