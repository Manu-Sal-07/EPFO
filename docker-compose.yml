version: "3.9"

# ==============================================================================
# PF COMPASS — Docker Compose (Local Development)
# ==============================================================================
# Usage:
#   docker compose up -d              ← Start all services
#   docker compose up -d postgres redis  ← Start only infrastructure
#   docker compose logs -f backend    ← Stream backend logs
#   docker compose down -v            ← Stop and remove volumes
#
# On first run:
#   docker compose up -d postgres redis
#   cd backend && alembic upgrade head
#   cd backend && python scripts/seed_demo_data.py
# ==============================================================================

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pfcompass_postgres
    environment:
      POSTGRES_DB: pfcompass
      POSTGRES_USER: pfcompass
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfcompass -d pfcompass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pfcompass_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ─── Backend ───────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: pfcompass_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pfcompass:${DB_PASSWORD:-changeme}@postgres:5432/pfcompass
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-replace-in-production}
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      SEED_DEMO: "true"
      CORS_ORIGINS: "http://localhost:3000"
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload in development
      - ./backend:/app
      - /app/.venv   # exclude venv from mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend ──────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: pfcompass_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload in development
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
